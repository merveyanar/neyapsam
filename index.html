<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Ne Yapsam?</title>
<style>
body{
  font-family:Arial;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.recipe{
  border:1px solid #ddd;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
}
</style>
</head>
<body>

<div class="logo-container">

<img src="images/logo.png" alt="Ne Yapsam" class="logo">

</div>

<div id="recipes"></div>

<script src="recipes.js"></script>

<script>
const container = document.getElementById("recipes");

recipes.forEach(recipe => {

  const html = `
    <div class="recipe">
      <img src="${recipe.image}" alt="${recipe.title}" class="recipe-image">

      <h2>${recipe.title}</h2>

      <h3>Malzemeler</h3>
      <ul>
        ${recipe.ingredients
          .map(i => `<li>${i}</li>`)
          .join("")}
      </ul>

      <h3>Hazırlanışı</h3>
      <p>${recipe.instructions}</p>
    </div>
  `;

  container.innerHTML += html;
});
</script>

</body>
</html>
